set timeout=0
set default=0
if [ "$grub_platform" = "efi" ]; then
    # UEFI: no VBE, and the firmware's graphics (GOP) usually offers just
    # the screen's own mode, which GRUB is already in: hand that over.
    insmod all_video
    set gfxpayload=keep
else
    set gfxpayload=@GFXMODE@
fi

menuentry "Doom" {
    # Kernel options: audio=hda|hdmi|analog|ac97|sb|off, hda=BB:DD.F, sb=220,1, latency=MS, usb=off
    # Anything else goes to Doom, e.g.: -warp 1 1 -skill 4 -file mymod.wad -mb 32
    multiboot /boot/doom.elf
    # The FAT32 RAM disk: the WAD(s), and where the config and saved games go
    module /boot/doom.img.gz doom.img
    boot
}
